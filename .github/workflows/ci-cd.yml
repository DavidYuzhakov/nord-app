name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Check ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.package == 'backend'
        env:
          DATABASE_URL: postgresql://noop:noop@localhost:5432/noop
        run: npx prisma generate

      - name: Check backend
        if: matrix.package == 'backend'
        run: |
          npx eslint "{src,apps,libs,test}/**/*.ts"
          npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Check frontend
        if: matrix.package == 'frontend'
        run: |
          npm run lint
          npm run format:check

  deploy:
    name: Deploy release
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: nord-app-production
      cancel-in-progress: false
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must have the form vX.Y.Z.'
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$release_sha" ]]; then
            echo '::error::The release tag no longer matches the checked commit.'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/master; then
            echo '::error::The release commit must belong to the history of master.'
            exit 1
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          for variable in VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_HOST VPS_PORT VPS_USER VPS_APP_DIR COMPOSE_PROJECT_NAME; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing configuration: $variable"
              exit 1
            fi
          done

          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/nord-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          remote_command="$(python3 - <<'PY'
          import os
          import shlex

          command = ['timeout', '--signal=TERM', '--kill-after=30s', '30m', 'bash', '-s', '--']
          command.extend(os.environ[name] for name in (
              'VPS_APP_DIR', 'COMPOSE_PROJECT_NAME', 'RELEASE_TAG', 'RELEASE_SHA'
          ))
          print(shlex.join(command))
          PY
          )"

          ssh -T \
            -i "$ssh_dir/key" \
            -p "$VPS_PORT" \
            -l "$VPS_USER" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -- "$VPS_HOST" "$remote_command" < scripts/deploy.sh

          printf 'Deployed `%s` (`%s`).\n' "$RELEASE_TAG" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
