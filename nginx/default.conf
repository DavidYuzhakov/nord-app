server {
  listen 80;
  server_name nord-app.ru api.nord-app.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name nord-app.ru;

  ssl_certificate /etc/letsencrypt/live/nord-app.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nord-app.ru/privkey.pem;

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
  listen 443 ssl;
  server_name api.nord-app.ru;

  ssl_certificate /etc/letsencrypt/live/nord-app.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nord-app.ru/privkey.pem;

  location / {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}