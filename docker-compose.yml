services:
  postgres:
    container_name: postgres
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./backend/.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mydb']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nord-app
    expose:
      - 5432

  backend:
    build: './backend'
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      AUDIO_UPLOAD_DIR: /app/uploads/audio
    volumes:
      - audio_uploads:/app/uploads/audio
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nord-app
    expose:
      - 3000
  frontend:
    build: './frontend'
    container_name: frontend
    restart: unless-stopped
    networks:
      - nord-app
    expose:
      - 80
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './nginx:/etc/nginx/conf.d'
      - './certbot/conf:/etc/letsencrypt'
      - './certbot/www:/var/www/certbot'
    depends_on:
      - frontend
      - backend
    networks:
      - nord-app
  certbot:
    image: certbot/certbot
    container_name: certbot
    depends_on:
      - nginx
    volumes:
      - './certbot/conf:/etc/letsencrypt'
      - './certbot/www:/var/www/certbot'

networks:
  nord-app:

volumes:
  postgres_data:
  audio_uploads:
